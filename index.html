<body>

<div id="nav-insert"></div>
<script>
  $(function(){
  $("#nav-insert").load("navbar.html");
});
</script>

<main>
  <h2>Find Us</h2>
  <section class="content-block">

    <div class="two-col">
      <p><strong><a href="https://www.liverpoolguild.org/groups/society/14342/">Guild Site</a></strong><br><strong><a href="https://www.instagram.com/uol.sf/">Instagram (@uol.sf)</a></strong></p>
      <p><strong><a href="https://chat.whatsapp.com/GzKBvXIoSjiHqRDDvu4uw3">Whatsapp  </a></strong><br><strong><a href="https://discord.com/invite/pAWT35jpTE">Discord Server</a></strong></p>

    </div>
    
    
  </section>

  <h2>What's On</h2>
  <section class="content-block">
    
      <div class="hilite">
        <div id="next-event" class="loading">Loading next event…</div>
        <script>
          async function renderNextEvent() {
            const container = document.getElementById('next-event');
            try {
              const res = await fetch('/next-event.json?_=' + Date.now());
              if (!res.ok) throw new Error(`Fetch failed: ${res.status}`);
              const event = await res.json();

              if (!event) {
                container.className = 'empty';
                container.textContent = 'No upcoming events.';
                return;
              }

              const start = new Date(event.start);
              const dateStr = event.allDay
                ? start.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })
                : start.toLocaleString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', hour: 'numeric', minute: '2-digit' });

              container.className = '';
              container.innerHTML = `
                <h3>${escapeHtml(event.summary)}</h3>
                <p>${dateStr}</p>
                ${event.location ? `<p>📍 ${escapeHtml(event.location)}</p>` : ''}
                ${event.description ? `<p>${escapeHtml(event.description)}</p>` : ''}
              `;
            } catch (err) {
              console.error(err);
              container.className = 'error';
              container.textContent = 'Could not load the next event.';
            }
          }

          function escapeHtml(str) {
            const div = document.createElement('div');
            div.textContent = str;
            return div.innerHTML;
          }

          renderNextEvent();
        </script>
        </div>
  </section>
</main>



</body>
</html>
